[package]
name = "ptrade-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "MIT"
description = "Native DuckDB 1.5.6 incremental CNE lake ingestion and verification"

[[bin]]
name = "engine-probe"
path = "src/bin/engine_probe.rs"

[dependencies]
duckdb = { version = "=1.10506.0", features = ["parquet", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "debuginfo"
