[package]
name = "ptrade-fetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native TDX downloader with verified immutable CNE Parquet shards"
license = "MIT"

[lib]
name = "ptrade_fetch"
path = "src/lib.rs"

[[bin]]
name = "ptrade-fetch"
path = "src/main.rs"

[dependencies]
arrow-array = "=57.0.0"
arrow-schema = "=57.0.0"
parquet = { version = "=57.0.0", default-features = false, features = ["arrow", "zstd"] }
chrono = { version = "=0.4.42", features = ["serde"] }
clap = { version = "=4.5.51", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
fs2 = "=0.4.3"
thiserror = "=2.0.17"

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
